project:
  id: "xiehe_zhouyisheng_20261018"
  description: "This project, conducted in collaboration with Dr. Zhou at Peking Union Medical College Hospital (PUMCH), involves Bulk RNA-seq analysis of 21 mouse samples divided into seven experimental groups (A¨CG), with three biological replicates per group. The primary objectives are to identify differentially expressed genes through pairwise comparisons between Group A and each of the other six groups, as well as B vs. C, D vs. E, and F vs. G; investigate transcriptional differences among Groups C, E, and G; and perform an integrated analysis across all seven groups to identify overall gene expression differences beyond pairwise comparisons. Multi-group differential expression analysis using the DESeq2 likelihood ratio test (LRT), gene expression pattern clustering, and exploratory weighted gene co-expression network analysis (WGCNA) will be considered to identify group-associated expression signatures, co-expression modules, and potential hub genes. Functional enrichment analyses, including GO, KEGG, and GSEA, will be performed to explore the biological pathways and molecular mechanisms underlying these transcriptional differences."

