project:
  id: "BulkRNA_001"
  description: "Treatment vs Control"

kubernetes:
  namespace: "default"
  shell_pod: "shell-pod-name"
  r_pod: "r-pod-name"
  account: null

species:
  name: "mouse"
  genome: "GRCm39"
  annotation: "Ensembl_109"

paths:
  input_dir: "/home/zhangke/RNA-seq/project001/raw_data"
  output_dir: "/home/zhangke/RNA-seq/project001/results"
  reference_dir: "/home/zhangke/public_database"

input:
  type: "fastq"
  paired_end: true

analysis:
  fastp: true
  star: true
  featurecounts: true
  sample_qc: true
  differential_expression: true
  go_enrichment: true
  kegg_enrichment: true
  gsea: true
  custom_analysis: false

deseq2:
  design: "~ group"
  fdr: 0.05
  log2fc_cutoff: 1

execution:
  resume: true
  overwrite: false
  mode: "standard"
